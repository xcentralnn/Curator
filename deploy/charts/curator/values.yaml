controller:
  replicaCount: 1
  image:
    repository: xcentralnn/curator-controller
    tag: "v1.0.1"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

mlEngine:
  replicaCount: 1
  image:
    repository: xcentralnn/curator-ml
    tag: "v1.0.1"
    pullPolicy: IfNotPresent
  prometheusUrl: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

ui:
  replicaCount: 1
  image:
    repository: xcentralnn/curator-ui
    tag: "v1.0.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
