{{- if .Values.ui.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: curator-ui
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: curator-ui-role
rules:
- apiGroups:
  - "xcentralnn.io"
  resources:
  - "curatorscalers"
  verbs:
  - "create"
  - "delete"
  - "get"
  - "list"
  - "patch"
  - "update"
  - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: curator-ui-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: curator-ui-role
subjects:
- kind: ServiceAccount
  name: curator-ui
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curator-ui
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curator-ui
  template:
    metadata:
      labels:
        app: curator-ui
    spec:
      serviceAccountName: curator-ui
      containers:
      - name: ui
        image: "{{ .Values.ui.repository }}:{{ .Values.ui.tag }}"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: curator-ui
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: curator-ui
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
{{- end }}
