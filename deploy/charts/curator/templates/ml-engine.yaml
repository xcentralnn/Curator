apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curator.fullname" . }}-ml-engine
  labels:
    {{- include "curator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-engine
spec:
  replicas: {{ .Values.mlEngine.replicaCount }}
  selector:
    matchLabels:
      {{- include "curator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ml-engine
  template:
    metadata:
      labels:
        {{- include "curator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ml-engine
    spec:
      containers:
        - name: ml-engine
          image: "{{ .Values.mlEngine.image.repository }}:{{ .Values.mlEngine.image.tag }}"
          imagePullPolicy: {{ .Values.mlEngine.image.pullPolicy }}
          env:
            - name: PROMETHEUS_URL
              value: {{ .Values.mlEngine.prometheusUrl | quote }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            {{- toYaml .Values.mlEngine.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curator.fullname" . }}-ml-engine
  labels:
    {{- include "curator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-engine
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "curator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ml-engine
